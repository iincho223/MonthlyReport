# =============================================================================
# messages.properties  -  アプリケーションメッセージ定義
# すべてのエラーメッセージ・バリデーションメッセージはここで一元管理する。
# 参照方法: MessageSource#getMessage(key, null, Locale.JAPANESE)
#           Bean Validation: @Pattern(message = "{キー名}")
# =============================================================================

# -----------------------------------------------------------------------------
# 認証エラー (AUTH)
# -----------------------------------------------------------------------------
error.auth.login_failed=認証に失敗しました
error.auth.refresh_token_invalid=リフレッシュトークンが無効です
error.auth.refresh_token_expired=リフレッシュトークンが失効しています
error.auth.user_not_found=認証情報が見つかりません
error.auth.unauthorized=未認証です
error.auth.invalid_header=Authorization ヘッダが不正です
error.auth.user_disabled=ユーザーが無効です

# -----------------------------------------------------------------------------
# 月報エラー (REPORT)
# -----------------------------------------------------------------------------
error.report.duplicate_month=同一月の月報は既に存在します
error.report.not_found=月報が見つかりません
error.report.no_update_permission=更新権限がありません
error.report.no_delete_permission=削除権限がありません
error.report.no_feedback_permission=回答権限がありません
error.report.feedback_self=自分の月報には回答できません
error.report.no_view_permission=参照権限がありません
error.report.invalid_status=status が不正です
error.report.conditions_missing_key=conditions に必須キーが不足しています
error.report.conditions_invalid_value=conditions の値が不正です
error.report.feedback_expired=フィードバック期限を過ぎています（報告月翌月5日まで）
error.report.no_create_permission=月報の作成権限がありません

# -----------------------------------------------------------------------------
# バリデーション (VALIDATION)
# Bean Validation の @Pattern 等 message 属性で {キー名} 形式で参照する。
# -----------------------------------------------------------------------------
validation.year_month=must be yyyy-MM

