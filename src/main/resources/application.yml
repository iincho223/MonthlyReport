spring:
  application:
    name: monthlyreport
  datasource:
    url: jdbc:mariadb://localhost:3306/monthlyreport
    username: monthlyreport
    password: monthlyreport
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
