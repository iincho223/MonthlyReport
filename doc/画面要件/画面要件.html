<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月報・組織管理システム</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, onSnapshot, deleteDoc, updateDoc, serverTimestamp, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'monthly-report-escalation-pro';

        const { createApp, ref, reactive, onMounted, computed, watch, nextTick, onUpdated } = Vue;

        const ROLES = {
            REPORTER: { id: 'REPORTER', label: 'メンバー', rank: 0 },
            TL: { id: 'TL', label: 'TL (Team Leader)', rank: 1 },
            GL: { id: 'GL', label: 'GL (Group Leader)', rank: 2 },
            OM: { id: 'OM', label: 'OM (Ops Manager)', rank: 3 },
        };

        const CONDITION_ITEMS = [
            { id: 'physical', label: '体調' },
            { id: 'stress', label: 'ストレス' },
            { id: 'relationships', label: '人間関係' },
            { id: 'worries', label: '悩み' },
            { id: 'fatigue', label: '疲れ' },
            { id: 'sleep', label: '睡眠' },
            { id: 'motivation', label: 'やる気' }
        ];

        const CONDITION_OPTIONS = [
            { id: 'best', label: '◎', desc: '絶好調', color: 'text-emerald-500' },
            { id: 'good', label: '○', desc: 'まぁまぁ普通', color: 'text-blue-500' },
            { id: 'bad', label: '▲', desc: 'ちょっと不調', color: 'text-amber-500' },
            { id: 'worst', label: '×', desc: 'もうだめ最悪', color: 'text-red-500' }
        ];

        const TROUBLE_STATUS = {
            PENDING: { id: 'PENDING', label: '未対応', color: 'bg-red-100 text-red-700' },
            ONGOING: { id: 'ONGOING', label: '対応中', color: 'bg-blue-100 text-blue-700' },
            RESOLVED: { id: 'RESOLVED', label: '解決済み', color: 'bg-emerald-100 text-emerald-700' }
        };

        const TROUBLE_SEVERITY = {
            LOW: { id: 'LOW', label: '低', color: 'text-gray-500' },
            MEDIUM: { id: 'MEDIUM', label: '中', color: 'text-amber-500' },
            HIGH: { id: 'HIGH', label: '高', color: 'text-red-500' }
        };

        // 初期シード用モックデータ
        const MOCK_API_DATA = {
            'EMP001': { name: '田中 太郎', employeeId: 'EMP001', password: 'pass', role: 'OM', office: '東京本社', team: '管理グループ' },
            'EMP002': { name: '鈴木 一郎', employeeId: 'EMP002', password: 'pass', role: 'GL', office: '大阪支社', team: '関西第一営業部' },
            'EMP003': { name: '佐藤 花子', employeeId: 'EMP003', password: 'pass', role: 'TL', office: '東京本社', team: 'チームA' },
            'EMP004': { name: '山田 健太', employeeId: 'EMP004', password: 'pass', role: 'REPORTER', office: '東京本社', team: 'チームA' }
        };

        const App = {
            setup() {
                const user = ref(null);
                const userProfile = ref(null);
                const reports = ref([]);
                const escalations = ref([]);
                const employees = ref([]);
                const offices = ref([]);
                const teams = ref([]);

                const loading = ref(true);
                const view = ref('reportList'); 
                const currentItem = ref(null);
                const notification = ref(null);
                const isAILoading = ref(false);
                const troubleLogText = ref("");

                const DEADLINE_DAY = 5;
                const currentMonthStr = new Date().toISOString().slice(0, 7);

                // --- フォームステート ---
                const reportFormData = reactive({
                    month: currentMonthStr, title: '', salesInfo: '特になし',
                    nextMonthOvertime: '', nextMonthOvertimeReason: '',
                    thisMonthOvertime: '', thisMonthOvertimeReason: '',
                    condition: {}, comments: ''
                });

                const troubleFormData = reactive({
                    targetEmployeeName: '', targetTeam: '', title: '', description: '', severity: 'MEDIUM', status: 'PENDING', history: []
                });

                const userFormData = reactive({
                    id: '', employeeId: '', name: '', password: '', role: 'REPORTER', office: '', team: ''
                });

                const officeFormData = reactive({
                    id: '', name: '', glId: ''
                });

                const teamFormData = reactive({
                    id: '', name: '', office: '', tlId: ''
                });

                const loginData = reactive({ employeeId: '', password: '' });

                // --- ユーティリティ ---
                const showNotification = (msg) => {
                    notification.value = msg;
                    setTimeout(() => notification.value = null, 3000);
                };

                const getEmployeeName = (empId) => {
                    const emp = employees.value.find(e => e.employeeId === empId);
                    return emp ? emp.name : '';
                };

                const callGemini = async (prompt) => {
                    isAILoading.value = true;
                    try {
                        const apiKey = "";
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        const res = await fetch(url, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                        const data = await res.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    } catch(e) {
                        return "AIの接続に失敗しました。";
                    } finally { isAILoading.value = false; }
                };

                // --- 初期化・データ監視 ---
                const initSeedData = async () => {
                    try {
                        const empRef = collection(db, 'artifacts', appId, 'public', 'data', 'employees');
                        const snap = await getDocs(empRef);
                        if (snap.empty) {
                            const batch = writeBatch(db);
                            // 社員シード
                            Object.values(MOCK_API_DATA).forEach(emp => {
                                const newRef = doc(empRef);
                                batch.set(newRef, { ...emp, id: newRef.id, createdAt: serverTimestamp() });
                            });
                            // グループ（営業所）シード
                            const offRef = collection(db, 'artifacts', appId, 'public', 'data', 'offices');
                            ['東京本社', '大阪支社'].forEach(off => {
                                const newRef = doc(offRef);
                                let glId = off === '大阪支社' ? 'EMP002' : 'EMP001'; 
                                batch.set(newRef, { name: off, glId, id: newRef.id, createdAt: serverTimestamp() });
                            });
                            // チームシード
                            const teamRef = collection(db, 'artifacts', appId, 'public', 'data', 'teams');
                            [{ n: '管理グループ', o: '東京本社', tl: 'EMP001' }, { n: 'チームA', o: '東京本社', tl: 'EMP003' }, { n: '関西第一営業部', o: '大阪支社', tl: 'EMP002' }].forEach(t => {
                                const newRef = doc(teamRef);
                                batch.set(newRef, { name: t.n, office: t.o, tlId: t.tl, id: newRef.id, createdAt: serverTimestamp() });
                            });
                            await batch.commit();
                        }
                    } catch (e) { console.error("Seed error", e); }
                };

                onMounted(async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    await initSeedData();

                    onAuthStateChanged(auth, async (u) => {
                        user.value = u;
                        if (u) {
                            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data'));
                            if (snap.exists()) userProfile.value = snap.data();
                        }
                        loading.value = false;
                        nextTick(() => lucide.createIcons());
                    });
                });

                onUpdated(() => lucide.createIcons());

                watch([user, userProfile], ([u, p]) => {
                    if (!u || !p) return;
                    
                    // Master Data Subscriptions
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), (snap) => {
                        employees.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'offices'), (snap) => {
                        offices.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'teams'), (snap) => {
                        teams.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });

                    // Reports Subscription
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), (snap) => {
                        let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        if (p.role === 'REPORTER') data = data.filter(r => r.authorId === u.uid);
                        else if (p.role === 'TL') data = data.filter(r => r.authorId === u.uid || r.team === p.team);
                        else if (p.role === 'GL') data = data.filter(r => r.authorId === u.uid || r.office === p.office);
                        reports.value = data.sort((a, b) => b.month.localeCompare(a.month));
                    });

                    // Escalations Subscription
                    if (ROLES[p.role]?.rank > 0) {
                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'escalations'), (snap) => {
                            let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            if (p.role === 'TL') data = data.filter(e => e.targetTeam === p.team || e.createdByUid === u.uid);
                            else if (p.role === 'GL') {
                                const myTeams = teams.value.filter(t => t.office === p.office).map(t => t.name);
                                data = data.filter(e => myTeams.includes(e.targetTeam) || e.createdByUid === u.uid);
                            }
                            escalations.value = data.sort((a, b) => b.updatedAt?.seconds - a.updatedAt?.seconds);
                        });
                    }
                }, { immediate: true });

                // --- Computed Properties ---
                const activeOffices = computed(() => offices.value.map(o => o.name));
                const activeTeams = computed(() => teams.value.map(t => t.name));

                // Form dynamics
                const availableTeamsForUserForm = computed(() => {
                    return teams.value.filter(t => t.office === userFormData.office).map(t => t.name);
                });

                // Permissions
                const canManageUsersAndGroups = computed(() => userProfile.value?.role === 'OM' || userProfile.value?.role === 'GL');
                
                const filteredEmployees = computed(() => {
                    if (!userProfile.value) return [];
                    if (userProfile.value.role === 'OM') return employees.value;
                    if (userProfile.value.role === 'GL') return employees.value.filter(e => e.office === userProfile.value.office);
                    return [];
                });

                const filteredAdminTeams = computed(() => {
                    if (!userProfile.value) return [];
                    if (userProfile.value.role === 'OM') return teams.value;
                    if (userProfile.value.role === 'GL') return teams.value.filter(t => t.office === userProfile.value.office);
                    return [];
                });

                const unsubmittedStatus = computed(() => {
                    if (!userProfile.value || ROLES[userProfile.value.role]?.rank === 0) return null;
                    const allUsers = employees.value.filter(u => {
                        if (userProfile.value.role === 'OM') return true;
                        if (userProfile.value.role === 'GL') return u.office === userProfile.value.office;
                        if (userProfile.value.role === 'TL') return u.team === userProfile.value.team;
                        return false;
                    }).filter(u => ROLES[u.role]?.rank === 0);
                    const submittedUserIds = reports.value.filter(r => r.month === currentMonthStr).map(r => r.reporterId);
                    const unsubmitted = allUsers.filter(u => !submittedUserIds.includes(u.employeeId));
                    const rate = allUsers.length > 0 ? Math.round(((allUsers.length - unsubmitted.length) / allUsers.length) * 100) : 100;
                    return { list: unsubmitted, rate, total: allUsers.length };
                });

                const isSelfSubmitted = computed(() => reports.value.some(r => r.month === currentMonthStr && r.authorId === user.value?.uid));
                const daysUntilDeadline = computed(() => {
                    const today = new Date();
                    const deadline = new Date(today.getFullYear(), today.getMonth(), DEADLINE_DAY);
                    if (today > deadline) return 0;
                    return Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                });

                // --- Methods ---
                const handleLogin = async () => {
                    loading.value = true;
                    try {
                        const cleanId = loginData.employeeId.trim().toUpperCase();
                        const cleanPass = loginData.password.trim();
                        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), where('employeeId', '==', cleanId));
                        const snap = await getDocs(q);
                        if (snap.empty) throw new Error('社員番号が見つかりません');
                        
                        const data = snap.docs[0].data();
                        if (data.password !== cleanPass) throw new Error('パスワードが間違っています');
                        
                        await setDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'profile', 'data'), data);
                        userProfile.value = data;
                    } catch (e) { showNotification(e.message); }
                    finally { loading.value = false; }
                };

                const setView = (v, item = null) => {
                    view.value = v;
                    currentItem.value = item;
                    
                    if (v === 'reportForm') {
                        if (item) Object.assign(reportFormData, JSON.parse(JSON.stringify(item)));
                        else Object.assign(reportFormData, { 
                            month: currentMonthStr, title: '', salesInfo: '特になし', nextMonthOvertime: '', nextMonthOvertimeReason: '',
                            thisMonthOvertime: '', thisMonthOvertimeReason: '', comments: '', 
                            condition: Object.fromEntries(CONDITION_ITEMS.map(i => [i.id, '○'])) 
                        });
                    }
                    if (v === 'troubleForm') {
                        if (item) Object.assign(troubleFormData, JSON.parse(JSON.stringify(item)));
                        else Object.assign(troubleFormData, { targetEmployeeName: '', targetTeam: userProfile.value?.team || activeTeams.value[0], title: '', description: '', severity: 'MEDIUM', status: 'PENDING', history: [] });
                    }
                    if (v === 'adminUserForm') {
                        if (item) Object.assign(userFormData, JSON.parse(JSON.stringify(item)));
                        else Object.assign(userFormData, { id: '', employeeId: '', name: '', password: '', role: 'REPORTER', office: userProfile.value.role === 'GL' ? userProfile.value.office : activeOffices.value[0], team: '' });
                    }
                    if (v === 'adminOfficeForm') {
                        if (item) Object.assign(officeFormData, JSON.parse(JSON.stringify(item)));
                        else Object.assign(officeFormData, { id: '', name: '', glId: '' });
                    }
                    if (v === 'adminTeamForm') {
                        if (item) Object.assign(teamFormData, JSON.parse(JSON.stringify(item)));
                        else Object.assign(teamFormData, { id: '', name: '', office: userProfile.value.role === 'GL' ? userProfile.value.office : activeOffices.value[0], tlId: '' });
                    }
                    nextTick(() => lucide.createIcons());
                };

                const saveReport = async () => {
                    if (!user.value || !userProfile.value) return;
                    const refCol = collection(db, 'artifacts', appId, 'public', 'data', 'reports');
                    
                    // 重複チェック (新規作成時のみ)
                    if (!currentItem.value) {
                        const q = query(refCol, where('authorId', '==', user.value.uid), where('month', '==', reportFormData.month));
                        const snap = await getDocs(q);
                        if (!snap.empty) {
                            showNotification("この月の報告書は既に提出されています。");
                            return;
                        }
                    }

                    const data = { 
                        ...reportFormData, authorId: user.value.uid, reporterName: userProfile.value.name, 
                        reporterId: userProfile.value.employeeId, team: userProfile.value.team, 
                        office: userProfile.value.office, updatedAt: serverTimestamp() 
                    };
                    if (currentItem.value) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', currentItem.value.id), data);
                    else await addDoc(refCol, { ...data, createdAt: serverTimestamp(), adminFeedback: "" });
                    setView('reportList'); showNotification("レポートを保存しました");
                };

                const saveTrouble = async () => {
                    if (!user.value || !userProfile.value) return;
                    const refCol = collection(db, 'artifacts', appId, 'public', 'data', 'escalations');
                    const currentRoleLabel = ROLES[userProfile.value.role]?.label || '管理者';
                    const data = { 
                        ...troubleFormData, createdByUid: user.value.uid, createdByName: userProfile.value.name, 
                        createdByRole: currentRoleLabel, updatedAt: serverTimestamp() 
                    };
                    if (currentItem.value) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'escalations', currentItem.value.id), data);
                    else await addDoc(refCol, { ...data, createdAt: serverTimestamp() });
                    setView('troubleList'); showNotification("エスカレーションを登録しました");
                };

                const saveUser = async () => {
                    if (!userFormData.employeeId || !userFormData.name) return;
                    const refCol = collection(db, 'artifacts', appId, 'public', 'data', 'employees');
                    const data = { 
                        employeeId: userFormData.employeeId.toUpperCase(), name: userFormData.name, password: userFormData.password,
                        role: userFormData.role, office: userFormData.office, team: userFormData.team, updatedAt: serverTimestamp()
                    };
                    
                    if (!userFormData.id) {
                        // Id check
                        const q = query(refCol, where('employeeId', '==', data.employeeId));
                        const snap = await getDocs(q);
                        if (!snap.empty) { showNotification("この社員番号は既に登録されています"); return; }
                        await addDoc(refCol, { ...data, createdAt: serverTimestamp() });
                    } else {
                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'employees', userFormData.id), data);
                    }
                    setView('adminUsers'); showNotification("ユーザー情報を保存しました");
                };

                const saveOffice = async () => {
                    if (!officeFormData.name || !officeFormData.glId) return;
                    const refCol = collection(db, 'artifacts', appId, 'public', 'data', 'offices');
                    const data = { name: officeFormData.name, glId: officeFormData.glId, updatedAt: serverTimestamp() };
                    if (officeFormData.id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'offices', officeFormData.id), data);
                    else await addDoc(refCol, { ...data, createdAt: serverTimestamp() });
                    setView('adminGroups'); showNotification("グループを保存しました");
                };

                const saveTeam = async () => {
                    if (!teamFormData.name || !teamFormData.office || !teamFormData.tlId) return;
                    const refCol = collection(db, 'artifacts', appId, 'public', 'data', 'teams');
                    const data = { name: teamFormData.name, office: teamFormData.office, tlId: teamFormData.tlId, updatedAt: serverTimestamp() };
                    if (teamFormData.id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'teams', teamFormData.id), data);
                    else await addDoc(refCol, { ...data, createdAt: serverTimestamp() });
                    setView('adminGroups'); showNotification("チームを保存しました");
                };

                const addTroubleLog = async () => {
                    if (!troubleLogText.value || !currentItem.value || !userProfile.value) return;
                    const log = { date: new Date().toLocaleString('ja-JP'), text: troubleLogText.value, author: userProfile.value.name };
                    const newHistory = [...(currentItem.value.history || []), log];
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'escalations', currentItem.value.id), { history: newHistory, updatedAt: serverTimestamp() });
                    currentItem.value.history = newHistory; troubleLogText.value = "";
                };

                const updateTroubleStatus = async (s) => {
                    if (!currentItem.value) return;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'escalations', currentItem.value.id), { status: s, updatedAt: serverTimestamp() });
                    currentItem.value.status = s;
                };

                const rewriteWithAI = async () => {
                    const text = await callGemini(`以下の文章をプロフェッショナルな上司向けの報告文にリライトしてください:\n${reportFormData.comments}`);
                    reportFormData.comments = text.trim();
                };

                const deleteItem = async (t, id) => {
                    if (!confirm("削除しますか？")) return;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', t, id));
                    if (t === 'reports') setView('reportList');
                    else if (t === 'escalations') setView('troubleList');
                    else if (t === 'employees') setView('adminUsers');
                    else setView('adminGroups');
                };

                return {
                    user, userProfile, reports, escalations, employees, offices, teams, loading, view, currentItem, notification,
                    reportFormData, troubleFormData, userFormData, officeFormData, teamFormData, loginData, troubleLogText, isAILoading,
                    ROLES, CONDITION_ITEMS, CONDITION_OPTIONS, TROUBLE_STATUS, TROUBLE_SEVERITY,
                    activeOffices, activeTeams, availableTeamsForUserForm, canManageUsersAndGroups,
                    filteredEmployees, filteredAdminTeams, unsubmittedStatus, isSelfSubmitted, daysUntilDeadline, currentMonthStr, DEADLINE_DAY,
                    getEmployeeName, handleLogin, handleLogout: () => { signOut(auth); window.location.reload(); },
                    setView, saveReport, saveTrouble, saveUser, saveOffice, saveTeam, addTroubleLog, updateTroubleStatus, rewriteWithAI, deleteItem
                };
            },
            template: `
                <div class="min-h-screen bg-slate-50 text-slate-900 font-sans antialiased">
                    <div v-if="loading" class="min-h-screen bg-indigo-950 flex flex-col items-center justify-center text-white">
                        <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4 text-indigo-400"></i>
                        <p class="font-black text-xs uppercase tracking-widest opacity-50">System Initializing</p>
                    </div>

                    <!-- Login -->
                    <div v-else-if="!userProfile" class="min-h-screen bg-indigo-950 flex items-center justify-center p-4">
                        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl animate-in zoom-in-95 duration-500">
                            <div class="text-center mb-10">
                                <div class="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center text-white mx-auto mb-4 shadow-xl"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
                                <h2 class="text-2xl font-black">月次・エスカレーション</h2>
                                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-2">Management Portal</p>
                            </div>
                            <form @submit.prevent="handleLogin" class="space-y-4">
                                <div><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-1 block">社員番号</label>
                                <input v-model.trim="loginData.employeeId" type="text" required class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none font-bold uppercase transition-all" placeholder="EMP001"></div>
                                <div><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-1 block">パスワード</label>
                                <input v-model.trim="loginData.password" type="password" required class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none font-bold transition-all" placeholder="pass"></div>
                                <button type="submit" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-2"><i data-lucide="log-in" class="w-5 h-5"></i> ログイン</button>
                                <div class="pt-6 mt-6 border-t text-[10px] text-slate-400 font-bold text-center">Test IDs: EMP001 (OM), EMP002 (GL), EMP003 (TL), EMP004 (メンバー)</div>
                            </form>
                        </div>
                    </div>

                    <div v-else class="flex flex-col min-h-screen">
                        <header class="bg-white border-b sticky top-0 z-50 px-6 py-4">
                            <div class="max-w-7xl mx-auto flex items-center justify-between">
                                <div class="flex items-center gap-6">

                                            <div class="grid sm:grid-cols-2 gap-6"><div v-for="item in CONDITION_ITEMS" :key="item.id" class="flex flex-col gap-2 p-5 bg-slate-50 rounded-3xl border border-slate-100"><span class="text-xs font-black text-slate-700 pl-1">{{item.label}}</span><div class="flex bg-slate-200 p-1.5 rounded-2xl gap-1"><button v-for="opt in CONDITION_OPTIONS" :key="opt.id" @click="reportFormData.condition[item.id] = opt.label" type="button" :class="reportFormData.condition[item.id] === opt.label ? 'bg-white shadow-xl scale-110 ' + opt.color : 'text-slate-400 opacity-60'" class="flex-1 h-12 rounded-xl flex items-center justify-center text-base font-black transition-all">{{opt.label}}</button></div></div></div>

                                        <div class="pt-8 border-t space-y-4"><div class="flex items-center justify-between"><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2">4. コメント</label><button @click="rewriteWithAI" :disabled="isAILoading || !reportFormData.comments" class="text-[10px] font-black bg-indigo-50 text-indigo-600 px-3 py-2 rounded-xl flex items-center gap-2 transition-all active:scale-95 disabled:opacity-50"><i data-lucide="sparkles" class="w-3 h-3"></i> AIリライト ✨</button></div><textarea v-model="reportFormData.comments" rows="5" class="w-full p-6 bg-slate-50 border-none rounded-3xl font-bold focus:ring-2 focus:ring-indigo-500" placeholder="問題点、困っていること、意見など"></textarea></div>
                                    </div>
                                    <div class="pt-10 flex gap-4"><button @click="setView('reportList')" class="flex-1 py-5 border-2 rounded-3xl font-black text-slate-400">キャンセル</button><button @click="saveReport" :disabled="!reportFormData.title" class="flex-[2] py-5 bg-indigo-600 text-white rounded-3xl font-black shadow-2xl disabled:opacity-30 transition-all">報告書を保存</button></div>
                                </section>
                            </div>

                            <!-- Report Detail View -->
                            <div v-if="view === 'reportDetail' && currentItem" class="max-w-4xl mx-auto space-y-8 animate-in zoom-in-95 pb-40">
                                <div class="flex items-center justify-between"><button @click="setView('reportList')" class="p-3 bg-white rounded-2xl border shadow-sm hover:bg-slate-50"><i data-lucide="chevron-left" class="w-6 h-6"></i></button><div class="flex gap-2"><button v-if="currentItem.authorId === user.uid" @click="setView('reportForm', currentItem)" class="px-6 py-2 bg-indigo-50 text-indigo-600 rounded-xl font-black text-xs">編集</button><button v-if="currentItem.authorId === user.uid || ROLES[userProfile.role]?.rank > 2" @click="deleteItem('reports', currentItem.id)" class="px-6 py-2 bg-red-50 text-red-500 rounded-xl font-black text-xs">削除</button></div></div>
                                <div class="bg-white rounded-[3rem] p-10 border shadow-sm space-y-10">
                                    <div class="flex flex-wrap items-center gap-3 mb-2"><span class="bg-slate-900 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest">{{currentItem.month}} REPORT</span><span class="bg-indigo-50 text-indigo-700 text-[10px] font-black px-4 py-1.5 rounded-full uppercase">{{currentItem.team}}</span></div><h2 class="text-4xl font-black text-slate-900 leading-tight border-b pb-8">{{currentItem.title}}</h2>
                                    <div class="space-y-12">
                                        <div><h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">営業情報</h3><p class="text-lg font-bold text-slate-700 whitespace-pre-wrap pl-4 border-l-4 border-indigo-100">{{currentItem.salesInfo || '特になし'}}</p></div>

                                            <div class="grid md:grid-cols-2 gap-8"><div class="bg-slate-50 p-6 rounded-3xl border border-slate-100"><div class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">1. 来月残業見込み</div><div class="text-3xl font-black text-indigo-600 mb-2">{{currentItem.nextMonthOvertime || '0'}} <span class="text-xs text-slate-400">h前後</span></div><div class="text-xs font-bold text-slate-500 italic">理由: {{currentItem.nextMonthOvertimeReason || '特になし'}}</div></div><div class="bg-slate-50 p-6 rounded-3xl border border-slate-100"><div class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">2. 今月残業見込み</div><div class="text-3xl font-black text-indigo-600 mb-2">{{currentItem.thisMonthOvertime || '0'}} <span class="text-xs text-slate-400">h前後</span></div><div class="text-xs font-bold text-slate-500 italic">理由: {{currentItem.thisMonthOvertimeReason || '特になし'}}</div></div></div>
                                            <div class="pt-8"><h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">3. コンディション自己診断</h3><div class="grid grid-cols-4 sm:grid-cols-7 gap-3"><div v-for="item in CONDITION_ITEMS" :key="item.id" class="text-center bg-slate-50 rounded-2xl py-5 border border-slate-100 shadow-sm"><div class="text-[9px] font-black text-slate-300 uppercase mb-2">{{item.label}}</div><div class="text-xl font-black text-slate-900">{{currentItem.condition?.[item.id] || '○'}}</div></div></div></div>
                                            <div class="pt-8 border-t"><h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">4. コメント</h3><div class="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden font-medium text-lg leading-relaxed whitespace-pre-wrap"><i data-lucide="quote" class="w-16 h-16 absolute -bottom-4 -right-4 opacity-10 rotate-12"></i>{{currentItem.comments}}</div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Trouble List View -->
                            <div v-if="view === 'troubleList'" class="space-y-6 animate-in fade-in">
                                <div class="flex items-center justify-between"><div><h2 class="text-2xl font-black text-red-600">エスカレーション管理</h2><p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Incident Management Board</p></div><button @click="setView('troubleForm')" class="bg-red-600 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-xl flex items-center gap-2 hover:bg-red-700 transition-all"><i data-lucide="alert-circle" class="w-4 h-4"></i> トラブル登録</button></div>
                                <div v-if="escalations.length === 0" class="bg-white border-4 border-dashed rounded-[3rem] py-20 text-center text-slate-300">No active incidents</div>
                                <div v-else class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div v-for="e in escalations" :key="e.id" @click="setView('troubleDetail', e)" class="bg-white p-8 rounded-[2.5rem] border-2 border-transparent hover:border-red-400 shadow-sm transition-all cursor-pointer group relative">
                                        <div class="flex justify-between items-start mb-4"><span :class="TROUBLE_STATUS[e.status]?.color" class="px-3 py-1 rounded-full text-[9px] font-black uppercase">{{TROUBLE_STATUS[e.status]?.label}}</span><span :class="TROUBLE_SEVERITY[e.severity]?.color" class="text-[10px] font-black uppercase">重要度: {{TROUBLE_SEVERITY[e.severity]?.label}}</span></div><h3 class="text-2xl font-black mb-2 text-slate-900">{{e.title}}</h3><p class="text-xs font-bold text-slate-400 mb-6">対象メンバー: {{e.targetEmployeeName}}</p>
                                        <div class="pt-6 border-t flex items-center justify-between text-[10px] font-black text-slate-400 uppercase"><span>担当: {{e.createdByName}}</span><i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-all"></i></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Trouble Form View -->
                            <div v-if="view === 'troubleForm'" class="max-w-3xl mx-auto space-y-8 animate-in slide-in-from-bottom-10 pb-40">
                                <div class="flex items-center gap-4 mb-6"><button @click="setView('troubleList')" class="p-3 bg-white rounded-2xl border shadow-sm"><i data-lucide="chevron-left" class="w-6 h-6"></i></button><h2 class="text-2xl font-black text-red-600">トラブル・エスカレーション登録</h2></div>
                                <section class="bg-white p-10 rounded-[3rem] border shadow-sm space-y-8">
                                    <div class="grid md:grid-cols-2 gap-8"><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">対象メンバー氏名</label><input v-model="troubleFormData.targetEmployeeName" type="text" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black"></div><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">所属チーム</label><select v-model="troubleFormData.targetTeam" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black outline-none"><option v-for="t in activeTeams" :key="t" :value="t">{{t}}</option></select></div></div>
                                    <div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">案件タイトル</label><input v-model="troubleFormData.title" type="text" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black"></div>
                                    <div class="grid md:grid-cols-2 gap-8 pt-6 border-t"><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2 block">重要度</label><div class="flex bg-slate-100 p-1.5 rounded-2xl"><button v-for="s in TROUBLE_SEVERITY" :key="s.id" @click="troubleFormData.severity = s.id" :class="troubleFormData.severity === s.id ? 'bg-white shadow-md ' + s.color : 'text-slate-400 opacity-60'" class="flex-1 py-3 rounded-xl text-[10px] font-black transition-all">{{s.label}}</button></div></div><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2 block">現在のステータス</label><select v-model="troubleFormData.status" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black outline-none"><option v-for="s in TROUBLE_STATUS" :key="s.id" :value="s.id">{{s.label}}</option></select></div></div>
                                    <div class="space-y-2 pt-6 border-t"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">詳細内容</label><textarea v-model="troubleFormData.description" rows="5" class="w-full p-6 bg-slate-50 border-none rounded-3xl font-bold"></textarea></div>
                                    <div class="pt-10 flex gap-4"><button @click="setView('troubleList')" class="flex-1 py-5 border-2 rounded-3xl font-black text-slate-400">キャンセル</button><button @click="saveTrouble" :disabled="!troubleFormData.title" class="flex-[2] py-5 bg-red-600 text-white rounded-3xl font-black shadow-2xl disabled:opacity-30 transition-all">案件を起票</button></div>
                                </section>
                            </div>

                            <!-- Trouble Detail View -->
                            <div v-if="view === 'troubleDetail' && currentItem" class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8 pb-40">
                                <div class="lg:col-span-2 space-y-8">
                                    <div class="bg-white rounded-[3rem] p-10 border shadow-sm relative overflow-hidden">
                                        <div class="flex items-center justify-between mb-8"><button @click="setView('troubleList')" class="p-3 bg-slate-100 rounded-2xl"><i data-lucide="arrow-left" class="w-5 h-5"></i></button><div class="flex gap-2"><button @click="setView('troubleForm', currentItem)" class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><i data-lucide="edit-3" class="w-4 h-4"></i></button><button @click="deleteItem('escalations', currentItem.id)" class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>
                                        <div class="border-b pb-8 mb-8"><div class="flex items-center gap-3 mb-4"><span :class="TROUBLE_STATUS[currentItem.status]?.color" class="px-3 py-1 rounded-full text-[9px] font-black uppercase">{{TROUBLE_STATUS[currentItem.status]?.label}}</span><span class="text-[10px] font-black text-red-500 uppercase">Severity: {{TROUBLE_SEVERITY[currentItem.severity]?.label}}</span></div><h2 class="text-3xl font-black text-slate-900 leading-tight">{{currentItem.title}}</h2><p class="mt-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Target: {{currentItem.targetEmployeeName}} ({{currentItem.targetTeam}})</p></div>
                                        <div class="space-y-8">
                                            <div><h3 class="text-[10px] font-black text-slate-400 uppercase mb-4">内容・原因</h3><p class="text-lg font-medium leading-relaxed whitespace-pre-wrap text-slate-700 bg-slate-50 p-6 rounded-[2rem] border border-slate-100">{{currentItem.description}}</p></div>
                                            <div><h3 class="text-[10px] font-black text-slate-400 uppercase mb-6">対応履歴タイムライン</h3>
                                                <div v-if="!currentItem.history || currentItem.history.length === 0" class="text-center py-10 text-slate-300 font-black text-xs uppercase">No history recorded</div>
                                                <div v-else class="space-y-6 relative pl-6 border-l-2 border-slate-100 ml-4">
                                                    <div v-for="(log, idx) in currentItem.history" :key="idx" class="relative">
                                                        <div class="absolute -left-[31px] top-1.5 w-4 h-4 bg-white border-4 border-red-500 rounded-full"></div><div class="bg-white p-5 rounded-2xl border shadow-sm"><p class="text-[10px] font-black text-slate-400 mb-2">{{log.date}} - {{log.author}}</p><p class="text-sm font-bold text-slate-700">{{log.text}}</p></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="space-y-6">
                                    <div class="bg-red-50 p-8 rounded-[3rem] border border-red-100 sticky top-28 shadow-xl">
                                        <h3 class="text-sm font-black text-red-700 uppercase mb-6 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5"></i> 経緯を追加記録</h3>
                                        <div class="space-y-4">
                                            <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase block mb-2">ステータス更新</label><div class="flex bg-white p-1 rounded-xl shadow-sm border"><button v-for="s in TROUBLE_STATUS" :key="s.id" @click="updateTroubleStatus(s.id)" :class="currentItem.status === s.id ? s.color + ' shadow-sm' : 'text-slate-300'" class="flex-1 py-2 rounded-lg text-[9px] font-black transition-all">{{s.label}}</button></div></div>
                                            <div class="space-y-1 pt-4"><label class="text-[10px] font-black text-slate-400 uppercase block mb-2">対応ログ</label><textarea v-model="troubleLogText" rows="4" class="w-full p-4 rounded-2xl border-none outline-none font-bold text-sm shadow-inner" placeholder="進捗を記入..."></textarea></div>
                                            <button @click="addTroubleLog" :disabled="!troubleLogText" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black text-xs shadow-lg hover:bg-red-700 disabled:opacity-30 transition-all flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> 保存する</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <div v-if="notification" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-5 rounded-[2.5rem] shadow-2xl flex items-center gap-4 z-[1000]"><div class="w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center"><i data-lucide="check" class="w-4 h-4 text-white"></i></div><span class="text-sm font-black tracking-tight">{{notification}}</span></div>
                    </div>
                </div>
            `
        };

        const vueApp = createApp(App);
        vueApp.mount('#app');
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input:focus, textarea:focus, select:focus { border: none; outline: none; }
    </style>
</head>
