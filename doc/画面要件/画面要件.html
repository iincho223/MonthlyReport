<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月報管理システム</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, onSnapshot, deleteDoc, updateDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'monthly-report-escalation-pro';

        const { createApp, ref, reactive, onMounted, computed, watch, nextTick, onUpdated } = Vue;

        const ROLES = {
            REPORTER: { id: 'REPORTER', label: 'メンバー', rank: 0 },
            TL: { id: 'TL', label: 'TL (Team Leader)', rank: 1 },
            GL: { id: 'GL', label: 'GL (Group Leader)', rank: 2 },
            OM: { id: 'OM', label: 'OM (Ops Manager)', rank: 3 },
        };

        const TEAMS = ['チームA', 'チームB', 'チームC', 'チームD', '管理グループ'];
        const OFFICES = ['東京本社', '大阪支社', '名古屋営業所', '福岡営業所'];

        const CONDITION_ITEMS = [
            { id: 'physical', label: '体調' },
            { id: 'stress', label: 'ストレス' },
            { id: 'relationships', label: '人間関係' },
            { id: 'worries', label: '悩み' },
            { id: 'fatigue', label: '疲れ' },
            { id: 'sleep', label: '睡眠' },
            { id: 'motivation', label: 'やる気' }
        ];

        const CONDITION_OPTIONS = [
            { id: 'best', label: '◎', desc: '絶好調', color: 'text-emerald-500' },
            { id: 'good', label: '○', desc: 'まぁまぁ普通', color: 'text-blue-500' },
            { id: 'bad', label: '▲', desc: 'ちょっと不調', color: 'text-amber-500' },
            { id: 'worst', label: '×', desc: 'もうだめ最悪', color: 'text-red-500' }
        ];

        const TROUBLE_STATUS = {
            PENDING: { id: 'PENDING', label: '未対応', color: 'bg-red-100 text-red-700' },
            ONGOING: { id: 'ONGOING', label: '対応中', color: 'bg-blue-100 text-blue-700' },
            RESOLVED: { id: 'RESOLVED', label: '解決済み', color: 'bg-emerald-100 text-emerald-700' }
        };

        const TROUBLE_SEVERITY = {
            LOW: { id: 'LOW', label: '低', color: 'text-gray-500' },
            MEDIUM: { id: 'MEDIUM', label: '中', color: 'text-amber-500' },
            HIGH: { id: 'HIGH', label: '高', color: 'text-red-500' }
        };

        // モックデータ（実際の運用ではFirestoreのUsers等から取得）
        const MOCK_API_DATA = {
            'EMP001': { name: '田中 太郎', employeeId: 'EMP001', password: 'pass', role: 'OM', office: '東京本社', team: '経営企画' },
            'EMP002': { name: '鈴木 一郎', employeeId: 'EMP002', password: 'pass', role: 'GL', office: '大阪支社', team: '関西第一営業部' },
            'EMP003': { name: '佐藤 花子', employeeId: 'EMP003', password: 'pass', role: 'TL', office: '東京本社', team: 'チームA' },
            'EMP004': { name: '山田 健太', employeeId: 'EMP004', password: 'pass', role: 'REPORTER', office: '東京本社', team: 'チームA' },
            'EMP005': { name: '伊藤 直樹', employeeId: 'EMP005', password: 'pass', role: 'REPORTER', office: '東京本社', team: 'チームA' },
            'EMP006': { name: '渡辺 真理', employeeId: 'EMP006', password: 'pass', role: 'REPORTER', office: '東京本社', team: 'チームB' }
        };

        const App = {
            setup() {
                const user = ref(null);
                const userProfile = ref(null);
                const reports = ref([]);
                const escalations = ref([]);
                const loading = ref(true);
                const view = ref('reportList'); 
                const currentItem = ref(null);
                const notification = ref(null);
                const searchName = ref("");
                const filterTeam = ref("");
                const isAILoading = ref(false);
                const troubleLogText = ref("");

                // 提出期限設定（毎月5日）
                const DEADLINE_DAY = 5;
                const currentMonthStr = new Date().toISOString().slice(0, 7);

                const reportFormData = reactive({
                    month: currentMonthStr,
                    title: '',
                    salesInfo: '特になし',
                    nextMonthOvertime: '',
                    nextMonthOvertimeReason: '',
                    thisMonthOvertime: '',
                    thisMonthOvertimeReason: '',
                    condition: {},
                    comments: ''
                });

                const troubleFormData = reactive({
                    targetEmployeeName: '',
                    targetTeam: '',
                    title: '',
                    description: '',
                    severity: 'MEDIUM',
                    status: 'PENDING',
                    history: []
                });

                const loginData = reactive({ employeeId: '', password: '' });

                const showNotification = (msg) => {
                    notification.value = msg;
                    setTimeout(() => notification.value = null, 3000);
                };

                const callGemini = async (prompt) => {
                    isAILoading.value = true;
                    try {
                        const apiKey = "";
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        const res = await fetch(url, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                        const data = await res.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    } catch(e) {
                        return "AIの接続に失敗しました。";
                    } finally { isAILoading.value = false; }
                };

                onMounted(async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    onAuthStateChanged(auth, async (u) => {
                        user.value = u;
                        if (u) {
                            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data'));
                            if (snap.exists()) userProfile.value = snap.data();
                        }
                        loading.value = false;
                        nextTick(() => lucide.createIcons());
                    });
                });

                onUpdated(() => lucide.createIcons());

                watch([user, userProfile], ([u, p]) => {
                    if (!u || !p) return;
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), (snap) => {
                        let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        if (p.role === 'REPORTER') data = data.filter(r => r.authorId === u.uid);
                        else if (p.role === 'TL') data = data.filter(r => r.authorId === u.uid || r.team === p.team);
                        reports.value = data.sort((a, b) => b.month.localeCompare(a.month));
                    });
                    if (ROLES[p.role]?.rank > 0) {
                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'escalations'), (snap) => {
                            let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            if (p.role === 'TL') data = data.filter(e => e.targetTeam === p.team || e.createdByUid === u.uid);
                            escalations.value = data.sort((a, b) => b.updatedAt?.seconds - a.updatedAt?.seconds);
                        });
                    }
                }, { immediate: true });

                // --- Methods ---
                const handleLogin = async () => {
                    loading.value = true;
                    try {
                        const cleanId = loginData.employeeId.trim().toUpperCase();
                        const data = MOCK_API_DATA[cleanId];
                        if (data && data.password === loginData.password.trim()) {
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'profile', 'data'), data);
                            userProfile.value = data;
                        } else { throw new Error('認証失敗'); }
                    } catch (e) { showNotification(e.message); }
                    finally { loading.value = false; }
                };

                const setView = (v, item = null) => {
                    view.value = v;
                    currentItem.value = item;
                    if (v === 'reportForm') {
                        if (item) Object.assign(reportFormData, JSON.parse(JSON.stringify(item)));
                        else Object.assign(reportFormData, { 
                            month: currentMonthStr, 
                            title: '', 
                            salesInfo: '特になし', 
                            nextMonthOvertime: '',
                            nextMonthOvertimeReason: '',
                            thisMonthOvertime: '',
                            thisMonthOvertimeReason: '',
                            comments: '', 
                            condition: Object.fromEntries(CONDITION_ITEMS.map(i => [i.id, '○'])) 
                        });
                    }
                    if (v === 'troubleForm') {
                        if (item) Object.assign(troubleFormData, JSON.parse(JSON.stringify(item)));
                        else Object.assign(troubleFormData, { targetEmployeeName: '', targetTeam: TEAMS[0], title: '', description: '', severity: 'MEDIUM', status: 'PENDING', history: [] });
                    }
                    nextTick(() => lucide.createIcons());
                };

                const saveReport = async () => {
                    if (!user.value || !userProfile.value) return;
                    const ref = collection(db, 'artifacts', appId, 'public', 'data', 'reports');
                    const data = { 
                        ...reportFormData, 
                        authorId: user.value.uid, 
                        reporterName: userProfile.value.name, 
                        reporterId: userProfile.value.employeeId, 
                        team: userProfile.value.team, 
                        office: userProfile.value.office, 
                        updatedAt: serverTimestamp() 
                    };
                    if (currentItem.value) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', currentItem.value.id), data);
                    else await addDoc(ref, { ...data, createdAt: serverTimestamp(), adminFeedback: "" });
                    setView('reportList'); showNotification("レポートを保存しました");
                };

                const saveTrouble = async () => {
                    if (!user.value || !userProfile.value) return;
                    const ref = collection(db, 'artifacts', appId, 'public', 'data', 'escalations');
                    
                    // 安全に役職ラベルを取得するためのチェック
                    const currentRoleLabel = ROLES[userProfile.value.role]?.label || '管理者';

                    const data = { 
                        ...troubleFormData, 
                        createdByUid: user.value.uid, 
                        createdByName: userProfile.value.name, 
                        createdByRole: currentRoleLabel, 
                        updatedAt: serverTimestamp() 
                    };
                    if (currentItem.value) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'escalations', currentItem.value.id), data);
                    else await addDoc(ref, { ...data, createdAt: serverTimestamp() });
                    setView('troubleList'); showNotification("エスカレーションを登録しました");
                };

                const addTroubleLog = async () => {
                    if (!troubleLogText.value || !currentItem.value || !userProfile.value) return;
                    const log = { 
                        date: new Date().toLocaleString('ja-JP'), 
                        text: troubleLogText.value, 
                        author: userProfile.value.name 
                    };
                    const newHistory = [...(currentItem.value.history || []), log];
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'escalations', currentItem.value.id), { 
                        history: newHistory, 
                        updatedAt: serverTimestamp() 
                    });
                    currentItem.value.history = newHistory;
                    troubleLogText.value = "";
                };

                const updateTroubleStatus = async (s) => {
                    if (!currentItem.value) return;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'escalations', currentItem.value.id), { status: s, updatedAt: serverTimestamp() });
                    currentItem.value.status = s;
                };

                const rewriteWithAI = async () => {
                    const text = await callGemini(`以下の文章をプロフェッショナルな上司向けの報告文にリライトしてください:\n${reportFormData.comments}`);
                    reportFormData.comments = text.trim();
                };

                const deleteItem = async (t, id) => {
                    if (!confirm("削除しますか？")) return;
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', t, id));
                    setView(t === 'reports' ? 'reportList' : 'troubleList');
                };

                // --- Computed ---
                const unsubmittedStatus = computed(() => {
                    if (!userProfile.value || ROLES[userProfile.value.role]?.rank === 0) return null;
                    const allUsers = Object.values(MOCK_API_DATA).filter(u => {
                        if (userProfile.value.role === 'OM') return true;
                        if (userProfile.value.role === 'GL') return u.office === userProfile.value.office;
                        if (userProfile.value.role === 'TL') return u.team === userProfile.value.team;
                        return false;
                    }).filter(u => ROLES[u.role]?.rank === 0);
                    const submittedUserIds = reports.value.filter(r => r.month === currentMonthStr).map(r => r.reporterId);
                    const unsubmitted = allUsers.filter(u => !submittedUserIds.includes(u.employeeId));
                    const rate = allUsers.length > 0 ? Math.round(((allUsers.length - unsubmitted.length) / allUsers.length) * 100) : 100;
                    return { list: unsubmitted, rate, total: allUsers.length };
                });

                const isSelfSubmitted = computed(() => {
                    return reports.value.some(r => r.month === currentMonthStr && r.authorId === user.value?.uid);
                });

                const daysUntilDeadline = computed(() => {
                    const today = new Date();
                    const deadline = new Date(today.getFullYear(), today.getMonth(), DEADLINE_DAY);
                    if (today > deadline) return 0;
                    const diff = deadline.getTime() - today.getTime();
                    return Math.ceil(diff / (1000 * 60 * 60 * 24));
                });

                return {
                    user, userProfile, reports, escalations, loading, view, currentItem, notification,
                    reportFormData, troubleFormData, loginData, troubleLogText, isAILoading,
                    ROLES, TEAMS, OFFICES, CONDITION_ITEMS, CONDITION_OPTIONS, TROUBLE_STATUS, TROUBLE_SEVERITY,
                    unsubmittedStatus, isSelfSubmitted, daysUntilDeadline, currentMonthStr, DEADLINE_DAY,
                    handleLogin, handleLogout: () => { signOut(auth); window.location.reload(); },
                    setView, saveReport, saveTrouble, addTroubleLog, updateTroubleStatus, rewriteWithAI, deleteItem
                };
            },
            template: `
                <div class="min-h-screen bg-slate-50 text-slate-900 font-sans antialiased">
                    <div v-if="loading" class="min-h-screen bg-indigo-950 flex flex-col items-center justify-center text-white">
                        <i data-lucide="loader-2" class="w-12 h-12 animate-spin mb-4 text-indigo-400"></i>
                        <p class="font-black text-xs uppercase tracking-widest opacity-50">System Initializing</p>
                    </div>

                    <!-- Login -->
                    <div v-else-if="!userProfile" class="min-h-screen bg-indigo-950 flex items-center justify-center p-4">
                        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl animate-in zoom-in-95 duration-500">
                            <div class="text-center mb-10">
                                <div class="w-16 h-16 bg-indigo-600 rounded-3xl flex items-center justify-center text-white mx-auto mb-4 shadow-xl">
                                    <i data-lucide="shield-check" class="w-8 h-8"></i>
                                </div>
                                <h2 class="text-2xl font-black">月次・エスカレーション</h2>
                                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-2">Management Portal</p>
                            </div>
                            <form @submit.prevent="handleLogin" class="space-y-4">
                                <div><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-1 block">社員番号</label>
                                <input v-model.trim="loginData.employeeId" type="text" required class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none font-bold uppercase transition-all" placeholder="EMP001"></div>
                                <div><label class="text-[10px] font-black text-slate-400 uppercase tracking-widest pl-2 mb-1 block">パスワード</label>
                                <input v-model.trim="loginData.password" type="password" required class="w-full p-4 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none font-bold transition-all" placeholder="pass"></div>
                                <button type="submit" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-2"><i data-lucide="log-in" class="w-5 h-5"></i> ログイン</button>
                                <div class="pt-6 mt-6 border-t text-[10px] text-slate-400 font-bold text-center">Test IDs: EMP001 (OM), EMP002 (GL), EMP003 (TL), EMP004 (メンバー)</div>
                            </form>
                        </div>
                    </div>

                    <div v-else class="flex flex-col min-h-screen">
                        <header class="bg-white border-b sticky top-0 z-50 px-6 py-4">
                            <div class="max-w-6xl mx-auto flex items-center justify-between">
                                <div class="flex items-center gap-6">
                                    <div class="flex items-center gap-3 cursor-pointer" @click="setView('reportList')"><div class="bg-indigo-600 p-2 rounded-xl text-white"><i data-lucide="layout-grid" class="w-5 h-5"></i></div><h1 class="text-lg font-black hidden md:block">Management Portal</h1></div>
                                    <nav class="flex items-center gap-2">
                                        <button @click="setView('reportList')" :class="view.includes('report') ? 'bg-indigo-50 text-indigo-600' : 'text-slate-400'" class="px-4 py-2 rounded-xl text-xs font-black transition-all">月次報告</button>
                                        <button v-if="ROLES[userProfile.role]?.rank > 0" @click="setView('troubleList')" :class="view.includes('trouble') ? 'bg-red-50 text-red-600' : 'text-slate-400'" class="px-4 py-2 rounded-xl text-xs font-black transition-all">エスカレーション</button>
                                    </nav>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="text-right hidden sm:block"><div class="text-xs font-black">{{userProfile.name}}</div><div class="text-[9px] font-bold text-indigo-500 uppercase">{{ROLES[userProfile.role]?.label}}</div></div>
                                    <button @click="handleLogout" class="p-2 bg-slate-100 text-slate-400 hover:text-red-500 rounded-xl transition-colors"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                                </div>
                            </div>
                        </header>

                        <!-- Submission Status Banner -->
                        <div class="bg-indigo-900 text-white px-6 py-3">
                            <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                                <div class="flex items-center gap-3">
                                    <div class="bg-white/10 p-2 rounded-lg"><i data-lucide="calendar" class="w-4 h-4 text-indigo-200"></i></div>
                                    <p class="text-xs font-bold">今月 ({{currentMonthStr}}) の提出期限まであと <span class="text-lg font-black text-yellow-400">{{daysUntilDeadline}}</span> 日 ({{DEADLINE_DAY}}日〆切)</p>
                                </div>
                                <div v-if="!isSelfSubmitted" class="flex items-center gap-3 bg-red-500/20 px-4 py-2 rounded-xl border border-red-500/30 animate-pulse">
                                    <i data-lucide="alert-circle" class="w-4 h-4 text-red-400"></i>
                                    <p class="text-[10px] font-black uppercase tracking-widest">未提出アラート: お早めに提出してください</p>
                                </div>
                                <div v-else class="flex items-center gap-3 bg-emerald-500/20 px-4 py-2 rounded-xl border border-emerald-500/30">
                                    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
                                    <p class="text-[10px] font-black uppercase tracking-widest">今月分は提出済みです。お疲れ様です！</p>
                                </div>
                            </div>
                        </div>

                        <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-8">
                            
                            <!-- Report List View -->
                            <div v-if="view === 'reportList'" class="space-y-8">
                                <!-- Management Monitor Section -->
                                <div v-if="ROLES[userProfile.role]?.rank > 0 && unsubmittedStatus" class="bg-white p-8 rounded-[2.5rem] border shadow-sm animate-in fade-in duration-700">
                                    <div class="flex items-center justify-between mb-6">
                                        <div>
                                            <h3 class="text-lg font-black flex items-center gap-2"><i data-lucide="users" class="text-indigo-600"></i> 未提出者モニタリング</h3>
                                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Submission Tracking ({{currentMonthStr}})</p>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-2xl font-black text-indigo-600">{{unsubmittedStatus.rate}}%</div>
                                            <div class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">提出完了率</div>
                                        </div>
                                    </div>
                                    <div class="w-full bg-slate-100 h-2 rounded-full mb-8 overflow-hidden">
                                        <div :style="{ width: unsubmittedStatus.rate + '%' }" class="h-full bg-indigo-600 transition-all duration-1000"></div>
                                    </div>
                                    <div v-if="unsubmittedStatus.list.length === 0" class="text-center py-4 bg-emerald-50 rounded-2xl border border-emerald-100">
                                        <p class="text-xs font-black text-emerald-700">全員提出済みです！ ✨</p>
                                    </div>
                                    <div v-else class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                                        <div v-for="m in unsubmittedStatus.list" :key="m.employeeId" class="p-4 bg-red-50 border border-red-100 rounded-2xl flex flex-col items-center text-center">
                                            <div class="w-10 h-10 rounded-full bg-red-100 flex items-center justify-center font-black text-red-600 text-xs mb-2">{{m.name.charAt(0)}}</div>
                                            <div class="text-[11px] font-black text-slate-800 leading-tight">{{m.name}}</div>
                                            <div class="text-[9px] font-bold text-red-400 uppercase mt-1">{{m.employeeId}}</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between">
                                    <div><h2 class="text-2xl font-black">月次報告一覧</h2><p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Monthly Reports History</p></div>
                                    <button @click="setView('reportForm')" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-xl flex items-center gap-2 hover:bg-indigo-700 transition-all"><i data-lucide="plus" class="w-4 h-4"></i> 新規月報作成</button>
                                </div>
                                <div v-if="reports.length === 0" class="bg-white border-4 border-dashed rounded-[3rem] py-20 text-center text-slate-300 font-black text-sm uppercase">No reports found</div>
                                <div v-else class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    <div v-for="r in reports" :key="r.id" @click="setView('reportDetail', r)" class="bg-white p-8 rounded-[2.5rem] border-2 border-transparent hover:border-indigo-400 hover:shadow-2xl transition-all cursor-pointer shadow-sm relative group">
                                        <div class="flex justify-between items-start mb-6"><span class="bg-slate-900 text-white text-[10px] font-black px-3 py-1 rounded-lg">{{r.month}}</span><span :class="r.adminFeedback ? 'bg-emerald-500' : 'bg-amber-400'" class="text-[8px] font-black text-white px-2 py-1 rounded-full uppercase">{{r.adminFeedback ? 'Closed' : 'Reviewing'}}</span></div>
                                        <h3 class="text-xl font-black text-slate-900 mb-4 line-clamp-2 leading-tight group-hover:text-indigo-600 transition-colors">{{r.title}}</h3>
