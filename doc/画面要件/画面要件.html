<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月報・組織管理システム</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, onSnapshot, deleteDoc, updateDoc, serverTimestamp, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'monthly-report-escalation-pro';

        const { createApp, ref, reactive, onMounted, computed, watch, nextTick, onUpdated } = Vue;

        // ロール定義: 業務仕様書 2.2 / 5.1 準拠（NG/TM/TL/GL/OM/SP/SM/SA の8種）
        const ROLES = {
            NG: { id: 'NG', label: '新卒', rank: 0 },
            TM: { id: 'TM', label: 'メンバー', rank: 1 },
            TL: { id: 'TL', label: 'チームリーダー', rank: 2 },
            GL: { id: 'GL', label: 'グループリーダー', rank: 3 },
            OM: { id: 'OM', label: 'オフィスマネージャー', rank: 4 },
            SP: { id: 'SP', label: '営業担当者', rank: -1 },
            SM: { id: 'SM', label: '支店長', rank: -1 },
            SA: { id: 'SA', label: 'システム管理者', rank: -1 }
        };

        // 業務仕様書 2.3〜2.6 のロール別可視範囲をロール集合として定義
        const REPORT_ROLES = ['TM', 'TL', 'GL', 'OM'];
        const ESCALATION_ACCESS_ROLES = ['TL', 'GL', 'OM', 'SP', 'SM', 'SA'];
        const ESCALATION_CREATE_ROLES = ['TL', 'GL', 'OM'];
        const FEEDBACK_ROLES = ['TL', 'GL', 'OM'];
        const USER_MANAGE_ROLES = ['GL', 'OM', 'SP', 'SM', 'SA'];
        const ORG_MANAGE_ROLES = ['GL', 'OM', 'SA'];

        const CONDITION_ITEMS = [
            { id: 'physical', label: '体調' },
            { id: 'stress', label: 'ストレス' },
            { id: 'relationships', label: '人間関係' },
            { id: 'worries', label: '悩み' },
            { id: 'fatigue', label: '疲れ' },
            { id: 'sleep', label: '睡眠' },
            { id: 'motivation', label: 'やる気' }
        ];

        const CONDITION_OPTIONS = [
            { id: 'best', label: '◎', desc: '絶好調', color: 'text-emerald-500' },
            { id: 'good', label: '○', desc: 'まぁまぁ普通', color: 'text-blue-500' },
            { id: 'bad', label: '▲', desc: 'ちょっと不調', color: 'text-amber-500' },
            { id: 'worst', label: '×', desc: 'もうだめ最悪', color: 'text-red-500' }
        ];

        const TROUBLE_STATUS = {
            PENDING: { id: 'PENDING', label: '未対応', color: 'bg-red-100 text-red-700' },
            ONGOING: { id: 'ONGOING', label: '対応中', color: 'bg-blue-100 text-blue-700' },
            RESOLVED: { id: 'RESOLVED', label: '解決済み', color: 'bg-emerald-100 text-emerald-700' }
        };

        const TROUBLE_SEVERITY = {
            LOW: { id: 'LOW', label: '低', color: 'text-gray-500' },
            MEDIUM: { id: 'MEDIUM', label: '中', color: 'text-amber-500' },
            HIGH: { id: 'HIGH', label: '高', color: 'text-red-500' }
        };

        // 初期シード用モックデータ（8ロールを一通り確認できる構成）
        const MOCK_API_DATA = {
            'EMP001': { name: '田中 太郎', employeeId: 'EMP001', password: 'pass', role: 'OM', office: '東京本社', team: 'チームA' },
            'EMP002': { name: '鈴木 一郎', employeeId: 'EMP002', password: 'pass', role: 'GL', office: '東京本社', team: 'チームA' },
            'EMP003': { name: '佐藤 花子', employeeId: 'EMP003', password: 'pass', role: 'TL', office: '東京本社', team: 'チームA' },
            'EMP004': { name: '山田 健太', employeeId: 'EMP004', password: 'pass', role: 'TM', office: '東京本社', team: 'チームA' },
            'EMP005': { name: '新人 桜', employeeId: 'EMP005', password: 'pass', role: 'NG', office: '東京本社', team: 'チームA' },
            'EMP006': { name: '高橋 実', employeeId: 'EMP006', password: 'pass', role: 'GL', office: '大阪支社', team: '関西チームA' },
            'EMP007': { name: '伊藤 直樹', employeeId: 'EMP007', password: 'pass', role: 'TL', office: '大阪支社', team: '関西チームA' },
            'EMP008': { name: '渡辺 学', employeeId: 'EMP008', password: 'pass', role: 'TM', office: '大阪支社', team: '関西チームA' },
            'EMP009': { name: '中村 誠', employeeId: 'EMP009', password: 'pass', role: 'SP', office: '大阪支社', team: '' },
            'EMP010': { name: '小林 修', employeeId: 'EMP010', password: 'pass', role: 'SM', office: '大阪支社', team: '' },
            'EMP011': { name: 'システム 管理者', employeeId: 'EMP011', password: 'pass', role: 'SA', office: '', team: '' }
        };

        const App = {
            setup() {
                const user = ref(null);
                const userProfile = ref(null);
                const reports = ref([]);
                const escalations = ref([]);
                const employees = ref([]);
                const offices = ref([]);
                const groups = ref([]);
                const teams = ref([]);

                const loading = ref(true);
                const view = ref('reportList');
                const currentItem = ref(null);
                const notification = ref(null);
                const isAILoading = ref(false);
                const troubleLogText = ref("");
                const feedbackDraft = ref("");

                const DEADLINE_DAY = 5;
                const currentMonthStr = new Date().toISOString().slice(0, 7);

                // --- フォームステート ---
                const reportFormData = reactive({
                    month: currentMonthStr, title: '', salesInfo: '特になし',
                    nextMonthOvertime: '', nextMonthOvertimeReason: '',
                    thisMonthOvertime: '', thisMonthOvertimeReason: '',
                    condition: {}, comments: ''
                });

                const troubleFormData = reactive({
                    targetEmployeeName: '', targetTeam: '', title: '', description: '', severity: 'MEDIUM', status: 'PENDING',
                    dueDate: '', resolvedDate: '', assigneeId: '', history: []
                });

                const userFormData = reactive({
                    id: '', employeeId: '', name: '', password: '', role: 'TM', office: '', team: ''
                });

                const groupFormData = reactive({
                    id: '', code: '', name: '', office: '', glId: ''
                });

                const teamFormData = reactive({
                    id: '', code: '', name: '', group: '', tlId: ''
                });

                const loginData = reactive({ employeeId: '', password: '' });

                // --- 検索・絞り込みステート ---
                const reportFilters = reactive({ month: '', status: 'ALL' });
                const escalationFilters = reactive({ status: 'ALL' });
                const userSearch = reactive({ keyword: '', role: '', office: '' });
                const groupSearch = reactive({ name: '', office: '' });
                const teamSearch = reactive({ name: '', group: '' });

                // --- ユーティリティ ---
                const showNotification = (msg) => {
                    notification.value = msg;
                    setTimeout(() => notification.value = null, 3000);
                };

                const getEmployeeName = (empId) => {
                    const emp = employees.value.find(e => e.employeeId === empId);
                    return emp ? emp.name : '';
                };

                const callGemini = async (prompt) => {
                    isAILoading.value = true;
                    try {
                        const apiKey = "";
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                        const res = await fetch(url, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                        const data = await res.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    } catch(e) {
                        return "AIの接続に失敗しました。";
                    } finally { isAILoading.value = false; }
                };

                // --- 初期化・データ監視 ---
                const initSeedData = async () => {
                    try {
                        const empRef = collection(db, 'artifacts', appId, 'public', 'data', 'employees');
                        const snap = await getDocs(empRef);
                        if (snap.empty) {
                            const batch = writeBatch(db);
                            // 社員シード
                            Object.values(MOCK_API_DATA).forEach(emp => {
                                const newRef = doc(empRef);
                                batch.set(newRef, { ...emp, id: newRef.id, createdAt: serverTimestamp() });
                            });
                            // 営業所シード（営業所自体はマスタ固定、本画面からの追加/削除は行わない）
                            const offRef = collection(db, 'artifacts', appId, 'public', 'data', 'offices');
                            ['東京本社', '大阪支社'].forEach(off => {
                                const newRef = doc(offRef);
                                batch.set(newRef, { name: off, id: newRef.id, createdAt: serverTimestamp() });
                            });
                            // グループシード（営業所の配下、GLが統括）
                            const groupRef = collection(db, 'artifacts', appId, 'public', 'data', 'groups');
                            [
                                { code: 'GRP001', n: '東京第一グループ', o: '東京本社', gl: 'EMP002' },
                                { code: 'GRP002', n: '大阪営業グループ', o: '大阪支社', gl: 'EMP006' }
                            ].forEach(g => {
                                const newRef = doc(groupRef);
                                batch.set(newRef, { code: g.code, name: g.n, office: g.o, glId: g.gl, id: newRef.id, createdAt: serverTimestamp() });
                            });
                            // チームシード（グループの配下、TLが統括）
                            const teamRef = collection(db, 'artifacts', appId, 'public', 'data', 'teams');
                            [
                                { code: 'TEAM001', n: 'チームA', g: '東京第一グループ', o: '東京本社', tl: 'EMP003' },
                                { code: 'TEAM002', n: '関西チームA', g: '大阪営業グループ', o: '大阪支社', tl: 'EMP007' }
                            ].forEach(t => {
                                const newRef = doc(teamRef);
                                batch.set(newRef, { code: t.code, name: t.n, group: t.g, office: t.o, tlId: t.tl, id: newRef.id, createdAt: serverTimestamp() });
                            });
                            await batch.commit();
                        }
                    } catch (e) { console.error("Seed error", e); }
                };

                onMounted(async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    await initSeedData();

                    onAuthStateChanged(auth, async (u) => {
                        user.value = u;
                        if (u) {
                            const snap = await getDoc(doc(db, 'artifacts', appId, 'users', u.uid, 'profile', 'data'));
                            if (snap.exists()) userProfile.value = snap.data();
                        }
                        loading.value = false;
                        nextTick(() => lucide.createIcons());
                    });
                });

                onUpdated(() => lucide.createIcons());

                watch([user, userProfile], ([u, p]) => {
                    if (!u || !p) return;

                    // Master Data Subscriptions
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), (snap) => {
                        employees.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'offices'), (snap) => {
                        offices.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'groups'), (snap) => {
                        groups.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'teams'), (snap) => {
                        teams.value = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    });

                    // Reports Subscription（業務仕様書 2.3 準拠のロール別可視範囲）
                    onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), (snap) => {
                        let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        const role = p.role;
                        if (role === 'TM') data = data.filter(r => r.authorId === u.uid);
                        else if (role === 'TL') data = data.filter(r => r.authorId === u.uid || r.team === p.team);
                        else if (role === 'GL') {
                            const myGroupObj = groups.value.find(g => g.glId === p.employeeId);
                            const myTeams = myGroupObj ? teams.value.filter(t => t.group === myGroupObj.name).map(t => t.name) : [p.team];
                            data = data.filter(r => r.authorId === u.uid || myTeams.includes(r.team));
                        }
                        else if (role === 'OM') data = data.filter(r => r.authorId === u.uid || r.office === p.office);
                        else if (role === 'SP') {
                            const myTargets = escalations.value.filter(e => e.assigneeId === p.employeeId).map(e => e.targetEmployeeName);
                            data = data.filter(r => myTargets.includes(r.reporterName));
                        }
                        else if (role === 'SM') data = data.filter(r => r.office === p.office);
                        else if (role === 'SA') { /* 全件（表示時にマスク） */ }
                        else data = []; // NG: 月報アクセス不可
                        reports.value = data.sort((a, b) => b.month.localeCompare(a.month));
                    });

                    // Escalations Subscription（業務仕様書 2.4 準拠のロール別可視範囲）
                    if (ESCALATION_ACCESS_ROLES.includes(p.role)) {
                        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'escalations'), (snap) => {
                            let data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            if (p.role === 'TL') data = data.filter(e => e.team === p.team || e.createdByUid === u.uid);
                            else if (p.role === 'GL' || p.role === 'SM') data = data.filter(e => e.office === p.office);
                            else if (p.role === 'SP') data = data.filter(e => e.assigneeId === p.employeeId);
                            // OM・SA: 全件（SAは表示時にマスク）
                            escalations.value = data.sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));
                        });
                    } else {
                        escalations.value = [];
                    }
                }, { immediate: true });

                // --- Computed Properties ---
                const activeOffices = computed(() => offices.value.map(o => o.name));
                const activeTeams = computed(() => teams.value.map(t => t.name));

                const isBlockedRole = computed(() => userProfile.value?.role === 'NG');
                const canSubmitReport = computed(() => REPORT_ROLES.includes(userProfile.value?.role));
                const canAccessEscalation = computed(() => ESCALATION_ACCESS_ROLES.includes(userProfile.value?.role));
                const canCreateEscalation = computed(() => ESCALATION_CREATE_ROLES.includes(userProfile.value?.role));
                const canGiveFeedbackRole = computed(() => FEEDBACK_ROLES.includes(userProfile.value?.role));
                const canManageUsers = computed(() => USER_MANAGE_ROLES.includes(userProfile.value?.role));
                const canManageOrg = computed(() => ORG_MANAGE_ROLES.includes(userProfile.value?.role));
                const isMasked = computed(() => userProfile.value?.role === 'SA');
                const maskText = (text) => (isMasked.value && text) ? '●●●●●（マスク表示）' : text;

                // GLが統括するグループ
                const myGroup = computed(() => groups.value.find(g => g.glId === userProfile.value?.employeeId) || null);

                // Form dynamics
                const availableTeamsForUserForm = computed(() => {
                    let list = teams.value.filter(t => t.office === userFormData.office);
                    if (userProfile.value?.role === 'GL') list = list.filter(t => t.group === myGroup.value?.name);
                    return list.map(t => t.name);
                });

                const registrableRoles = computed(() => {
                    const role = userProfile.value?.role;
                    if (role === 'SA') return Object.values(ROLES);
                    if (role === 'SP' || role === 'SM') return [ROLES.NG, ROLES.TM, ROLES.SP, ROLES.SM];
                    return [ROLES.NG, ROLES.TM]; // GL / OM
                });

                const userManagementScope = computed(() => {
                    if (!userProfile.value) return [];
                    const p = userProfile.value;
                    if (p.role === 'SA') return employees.value;
                    if (p.role === 'OM') return employees.value.filter(e => e.office === p.office);
                    if (p.role === 'SP' || p.role === 'SM') return employees.value.filter(e => e.office === p.office && ['NG', 'TM', 'SP', 'SM'].includes(e.role));
                    if (p.role === 'GL') {
                        const myTeams = teams.value.filter(t => t.group === myGroup.value?.name).map(t => t.name);
                        return employees.value.filter(e => myTeams.includes(e.team));
                    }
                    return [];
                });

                const filteredEmployees = computed(() => userManagementScope.value.filter(e => {
                    const kw = userSearch.keyword.trim().toLowerCase();
                    const matchesKeyword = !kw || e.employeeId.toLowerCase().includes(kw) || e.name.toLowerCase().includes(kw);
                    const matchesRole = !userSearch.role || e.role === userSearch.role;
                    const matchesOffice = !userSearch.office || e.office === userSearch.office;
                    return matchesKeyword && matchesRole && matchesOffice;
                }));

                const groupManagementScope = computed(() => {
                    if (!userProfile.value) return [];
                    const p = userProfile.value;
                    if (p.role === 'SA') return groups.value;
                    if (p.role === 'OM') return groups.value.filter(g => g.office === p.office);
                    if (p.role === 'GL') return groups.value.filter(g => g.glId === p.employeeId);
                    return [];
                });

                const filteredGroups = computed(() => groupManagementScope.value.filter(g => {
                    const kw = groupSearch.name.trim();
                    const matchesName = !kw || g.name.includes(kw);
                    const matchesOffice = !groupSearch.office || g.office === groupSearch.office;
                    return matchesName && matchesOffice;
                }));

                const teamManagementScope = computed(() => {
                    if (!userProfile.value) return [];
                    const p = userProfile.value;
                    if (p.role === 'SA') return teams.value;
                    if (p.role === 'OM') return teams.value.filter(t => t.office === p.office);
                    if (p.role === 'GL') return teams.value.filter(t => t.group === myGroup.value?.name);
                    return [];
                });

                const filteredTeams = computed(() => teamManagementScope.value.filter(t => {
                    const kw = teamSearch.name.trim();
                    const matchesName = !kw || t.name.includes(kw);
                    const matchesGroup = !teamSearch.group || t.group === teamSearch.group;
                    return matchesName && matchesGroup;
                }));

                const canCreateGroup = computed(() => ['OM', 'SA'].includes(userProfile.value?.role));

                const availableGroupsForTeamForm = computed(() => {
                    if (userProfile.value?.role === 'GL') return myGroup.value ? [myGroup.value.name] : [];
                    if (userProfile.value?.role === 'OM') return groups.value.filter(g => g.office === userProfile.value.office).map(g => g.name);
                    return groups.value.map(g => g.name); // SA
                });

                // 未提出者モニタリング・KPI（TL/GL/OM のみ、TMのみを集計対象とする）
                const unsubmittedStatus = computed(() => {
                    if (!userProfile.value || !FEEDBACK_ROLES.includes(userProfile.value.role)) return null;
                    const p = userProfile.value;
                    const scopeMembers = employees.value.filter(e => {
                        if (e.role !== 'TM') return false;
                        if (p.role === 'TL') return e.team === p.team;
                        if (p.role === 'GL') {
                            const myTeams = teams.value.filter(t => t.group === myGroup.value?.name).map(t => t.name);
                            return myTeams.includes(e.team);
                        }
                        if (p.role === 'OM') return e.office === p.office;
                        return false;
                    });
                    const submittedIds = reports.value.filter(r => r.month === currentMonthStr).map(r => r.reporterId);
                    const unsubmitted = scopeMembers.filter(e => !submittedIds.includes(e.employeeId));
                    const rate = scopeMembers.length > 0 ? Math.round(((scopeMembers.length - unsubmitted.length) / scopeMembers.length) * 100) : 100;
                    return { list: unsubmitted, rate, total: scopeMembers.length };
                });

                // 未回答報告数（自分以外 かつ 回答未登録、TL/GL/OM のみ）
                const pendingFeedbackCount = computed(() => {
                    if (!userProfile.value || !FEEDBACK_ROLES.includes(userProfile.value.role)) return 0;
                    return reports.value.filter(r => r.authorId !== user.value?.uid && !r.adminFeedback).length;
                });

                const filteredReports = computed(() => reports.value.filter(r => {
                    const matchesMonth = !reportFilters.month || r.month === reportFilters.month;
                    let matchesStatus = true;
                    if (reportFilters.status === 'PENDING_FEEDBACK') matchesStatus = !r.adminFeedback;
                    else if (reportFilters.status === 'FEEDBACKED') matchesStatus = !!r.adminFeedback;
                    return matchesMonth && matchesStatus;
                }));

                const filteredEscalations = computed(() => escalations.value.filter(e => escalationFilters.status === 'ALL' || e.status === escalationFilters.status));

                const isSelfSubmitted = computed(() => reports.value.some(r => r.month === currentMonthStr && r.authorId === user.value?.uid));
                const daysUntilDeadline = computed(() => {
                    const today = new Date();
                    const deadline = new Date(today.getFullYear(), today.getMonth(), DEADLINE_DAY);
                    if (today > deadline) return 0;
                    return Math.ceil((deadline.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
                });

                // 回答（フィードバック）は TL以上かつ他者の月報のみ、報告月の翌月5日まで
                const canGiveFeedback = computed(() => {
                    if (!currentItem.value || !userProfile.value) return false;
                    return FEEDBACK_ROLES.includes(userProfile.value.role) && currentItem.value.authorId !== user.value?.uid;
                });
                const feedbackDeadlinePassed = computed(() => {
                    if (!currentItem.value) return false;
                    const [y, m] = currentItem.value.month.split('-').map(Number);
                    const deadline = new Date(y, m, DEADLINE_DAY, 23, 59, 59); // 報告月の翌月DEADLINE_DAY日まで
                    return new Date() > deadline;
                });

                // エスカレーション編集可否: 起票者本人／自チーム(TL)／担当案件(SP)／GL・SM・OM・SA
                const canEditEscalation = computed(() => {
                    if (!currentItem.value || !userProfile.value) return false;
                    const role = userProfile.value.role;
                    if (['GL', 'SM', 'OM', 'SA'].includes(role)) return true;
                    if (role === 'TL') return currentItem.value.createdByUid === user.value?.uid || currentItem.value.team === userProfile.value.team;
                    if (role === 'SP') return currentItem.value.assigneeId === userProfile.value.employeeId;
                    return false;
                });

                // --- Methods ---
                const handleLogin = async () => {
                    loading.value = true;
                    try {
                        const cleanId = loginData.employeeId.trim().toUpperCase();
                        const cleanPass = loginData.password.trim();
                        const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'employees'), where('employeeId', '==', cleanId));
                        const snap = await getDocs(q);
                        if (snap.empty) throw new Error('社員番号が見つかりません');

                        const data = snap.docs[0].data();
                        if (data.password !== cleanPass) throw new Error('パスワードが間違っています');

                        await setDoc(doc(db, 'artifacts', appId, 'users', user.value.uid, 'profile', 'data'), data);
                        userProfile.value = data;
                    } catch (e) { showNotification(e.message); }

                                <div class="flex items-center justify-between"><button @click="setView('reportList')" class="p-3 bg-white rounded-2xl border shadow-sm hover:bg-slate-50"><i data-lucide="chevron-left" class="w-6 h-6"></i></button><div class="flex gap-2"><button v-if="currentItem.authorId === user.uid" @click="setView('reportForm', currentItem)" class="px-6 py-2 bg-indigo-50 text-indigo-600 rounded-xl font-black text-xs">編集</button><button v-if="currentItem.authorId === user.uid || userProfile.role === 'OM'" @click="deleteItem('reports', currentItem.id)" class="px-6 py-2 bg-red-50 text-red-500 rounded-xl font-black text-xs">削除</button></div></div>
                                <div class="bg-white rounded-[3rem] p-10 border shadow-sm space-y-10">
                                    <div class="flex flex-wrap items-center gap-3 mb-2"><span class="bg-slate-900 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest">{{currentItem.month}} REPORT</span><span class="bg-indigo-50 text-indigo-700 text-[10px] font-black px-4 py-1.5 rounded-full uppercase">{{currentItem.office}} / {{currentItem.team}}</span></div><h2 class="text-4xl font-black text-slate-900 leading-tight border-b pb-8">{{maskText(currentItem.title)}}</h2>
                                    <div class="space-y-12">
                                        <div><h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">営業情報</h3><p class="text-lg font-bold text-slate-700 whitespace-pre-wrap pl-4 border-l-4 border-indigo-100">{{maskText(currentItem.salesInfo) || '特になし'}}</p></div>
                                        <div class="space-y-8 pt-8 border-t"><h3 class="text-sm font-black text-indigo-600 uppercase tracking-widest">■ 月次報告</h3>
                                            <div class="grid md:grid-cols-2 gap-8"><div class="bg-slate-50 p-6 rounded-3xl border border-slate-100"><div class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">1. 来月残業見込み</div><div class="text-3xl font-black text-indigo-600 mb-2">{{currentItem.nextMonthOvertime || '0'}} <span class="text-xs text-slate-400">h前後</span></div><div class="text-xs font-bold text-slate-500 italic">理由: {{maskText(currentItem.nextMonthOvertimeReason) || '特になし'}}</div></div><div class="bg-slate-50 p-6 rounded-3xl border border-slate-100"><div class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">2. 今月残業見込み</div><div class="text-3xl font-black text-indigo-600 mb-2">{{currentItem.thisMonthOvertime || '0'}} <span class="text-xs text-slate-400">h前後</span></div><div class="text-xs font-bold text-slate-500 italic">理由: {{maskText(currentItem.thisMonthOvertimeReason) || '特になし'}}</div></div></div>
                                            <div class="pt-8"><h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">3. コンディション自己診断</h3><div class="grid grid-cols-4 sm:grid-cols-7 gap-3"><div v-for="item in CONDITION_ITEMS" :key="item.id" class="text-center bg-slate-50 rounded-2xl py-5 border border-slate-100 shadow-sm"><div class="text-[9px] font-black text-slate-300 uppercase mb-2">{{item.label}}</div><div class="text-xl font-black text-slate-900">{{isMasked ? '●' : (currentItem.condition?.[item.id] || '○')}}</div></div></div></div>
                                            <div class="pt-8 border-t"><h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">4. コメント</h3><div class="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden font-medium text-lg leading-relaxed whitespace-pre-wrap"><i data-lucide="quote" class="w-16 h-16 absolute -bottom-4 -right-4 opacity-10 rotate-12"></i>{{maskText(currentItem.comments)}}</div></div>
                                        </div>
                                        <div class="pt-8 border-t space-y-4">
                                            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">5. 回答</h3>
                                            <div v-if="currentItem.adminFeedback" class="bg-indigo-50 border border-indigo-100 p-6 rounded-[2rem] space-y-2">
                                                <p class="text-sm font-bold text-indigo-900 whitespace-pre-wrap">{{maskText(currentItem.adminFeedback.comment)}}</p>
                                                <p class="text-[10px] font-black text-indigo-400 uppercase">{{currentItem.adminFeedback.responderName}}（{{ROLES[currentItem.adminFeedback.responderRole]?.label}}） - {{new Date(currentItem.adminFeedback.respondedAt).toLocaleString('ja-JP')}}</p>
                                            </div>
                                            <div v-else class="text-xs font-bold text-slate-300 uppercase tracking-widest py-6 text-center border-2 border-dashed rounded-2xl">回答はまだ登録されていません</div>
                                            <div v-if="canGiveFeedback" class="pt-4 space-y-3">
                                                <textarea v-model="feedbackDraft" rows="4" maxlength="2000" class="w-full p-5 bg-slate-50 rounded-2xl font-bold text-sm" placeholder="回答コメントを入力（最大2000文字）"></textarea>
                                                <p v-if="feedbackDeadlinePassed" class="text-[10px] font-black text-red-400">回答受付期間（報告月の翌月{{DEADLINE_DAY}}日）を過ぎています</p>
                                                <button @click="saveFeedback" :disabled="!feedbackDraft.trim() || feedbackDeadlinePassed" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black text-sm shadow-lg disabled:opacity-30">回答を公開する</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Trouble List View -->
                            <div v-if="view === 'troubleList'" class="space-y-6 animate-in fade-in">
                                <div class="flex items-center justify-between"><div><h2 class="text-2xl font-black text-red-600">エスカレーション管理</h2><p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Incident Management Board</p></div><button v-if="canCreateEscalation" @click="setView('troubleForm')" class="bg-red-600 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-xl flex items-center gap-2 hover:bg-red-700 transition-all"><i data-lucide="alert-circle" class="w-4 h-4"></i> トラブル登録</button></div>
                                <div class="flex flex-wrap items-center gap-3 bg-white p-4 rounded-2xl border shadow-sm">
                                    <label class="text-[10px] font-black text-slate-400 uppercase">ステータス</label>
                                    <select v-model="escalationFilters.status" class="p-2 bg-slate-50 rounded-xl font-bold text-sm outline-none">
                                        <option value="ALL">すべて</option>
                                        <option v-for="s in TROUBLE_STATUS" :key="s.id" :value="s.id">{{s.label}}</option>
                                    </select>
                                </div>
                                <div v-if="filteredEscalations.length === 0" class="bg-white border-4 border-dashed rounded-[3rem] py-20 text-center text-slate-300">No active incidents</div>
                                <div v-else class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div v-for="e in filteredEscalations" :key="e.id" @click="setView('troubleDetail', e)" class="bg-white p-8 rounded-[2.5rem] border-2 border-transparent hover:border-red-400 shadow-sm transition-all cursor-pointer group relative">
                                        <div class="flex justify-between items-start mb-4"><span :class="TROUBLE_STATUS[e.status]?.color" class="px-3 py-1 rounded-full text-[9px] font-black uppercase">{{TROUBLE_STATUS[e.status]?.label}}</span><span :class="TROUBLE_SEVERITY[e.severity]?.color" class="text-[10px] font-black uppercase">重要度: {{TROUBLE_SEVERITY[e.severity]?.label}}</span></div><h3 class="text-2xl font-black mb-2 text-slate-900">{{e.title}}</h3><p class="text-xs font-bold text-slate-400 mb-6">対象メンバー: {{e.targetEmployeeName}} ({{e.targetTeam}})</p>
                                        <div class="pt-6 border-t flex items-center justify-between text-[10px] font-black text-slate-400 uppercase"><span>起票: {{e.createdByName}} / 期日: {{e.dueDate || '未設定'}}</span><i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-all"></i></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Trouble Form View -->
                            <div v-if="view === 'troubleForm'" class="max-w-3xl mx-auto space-y-8 animate-in slide-in-from-bottom-10 pb-40">
                                <div class="flex items-center gap-4 mb-6"><button @click="setView('troubleList')" class="p-3 bg-white rounded-2xl border shadow-sm"><i data-lucide="chevron-left" class="w-6 h-6"></i></button><h2 class="text-2xl font-black text-red-600">トラブル・エスカレーション登録</h2></div>
                                <section class="bg-white p-10 rounded-[3rem] border shadow-sm space-y-8">
                                    <div class="grid md:grid-cols-2 gap-8"><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">対象メンバー氏名</label><input v-model="troubleFormData.targetEmployeeName" type="text" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black"></div><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">所属チーム</label><select v-model="troubleFormData.targetTeam" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black outline-none"><option v-for="t in activeTeams" :key="t" :value="t">{{t}}</option></select></div></div>
                                    <div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">案件タイトル</label><input v-model="troubleFormData.title" type="text" maxlength="200" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black"></div>
                                    <div class="grid md:grid-cols-2 gap-8 pt-6 border-t"><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2 block">重要度</label><div class="flex bg-slate-100 p-1.5 rounded-2xl"><button v-for="s in TROUBLE_SEVERITY" :key="s.id" @click="troubleFormData.severity = s.id" :class="troubleFormData.severity === s.id ? 'bg-white shadow-md ' + s.color : 'text-slate-400 opacity-60'" class="flex-1 py-3 rounded-xl text-[10px] font-black transition-all">{{s.label}}</button></div></div><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2 block">現在のステータス</label><select v-model="troubleFormData.status" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black outline-none"><option v-for="s in TROUBLE_STATUS" :key="s.id" :value="s.id">{{s.label}}</option></select></div></div>
                                    <div class="grid md:grid-cols-2 gap-8 pt-6 border-t"><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">対応期日 (必須)</label><input v-model="troubleFormData.dueDate" type="date" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black"></div><div class="space-y-2"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">完了期日{{troubleFormData.status === 'RESOLVED' ? '（必須）' : ''}}</label><input v-model="troubleFormData.resolvedDate" type="date" :disabled="troubleFormData.status !== 'RESOLVED'" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black disabled:opacity-40"></div></div>
                                    <div class="space-y-2 pt-6 border-t"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">対応担当者</label>
                                        <select v-model="troubleFormData.assigneeId" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-black outline-none">
                                            <option value="" :disabled="!!currentItem?.assigneeId">未設定</option>
                                            <option v-for="emp in employees" :key="emp.employeeId" :value="emp.employeeId">{{emp.name}}（{{ROLES[emp.role]?.label}}）</option>
                                        </select>
                                        <p v-if="currentItem?.assigneeId" class="text-[10px] font-black text-slate-300 pl-2">一度設定した担当者は未設定に戻せません</p>
                                    </div>
                                    <div class="space-y-2 pt-6 border-t"><label class="text-[10px] font-black text-slate-400 uppercase pl-2">詳細内容</label><textarea v-model="troubleFormData.description" rows="5" maxlength="2000" class="w-full p-6 bg-slate-50 border-none rounded-3xl font-bold"></textarea></div>
                                    <div class="pt-10 flex gap-4"><button @click="setView('troubleList')" class="flex-1 py-5 border-2 rounded-3xl font-black text-slate-400">キャンセル</button><button @click="saveTrouble" :disabled="!troubleFormData.title || !troubleFormData.targetEmployeeName || !troubleFormData.dueDate || (troubleFormData.status === 'RESOLVED' && !troubleFormData.resolvedDate)" class="flex-[2] py-5 bg-red-600 text-white rounded-3xl font-black shadow-2xl disabled:opacity-30 transition-all">{{currentItem ? '案件を更新' : '案件を起票'}}</button></div>
                                </section>
                            </div>

                            <!-- Trouble Detail View -->
                            <div v-if="view === 'troubleDetail' && currentItem" class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8 pb-40">
                                <div class="lg:col-span-2 space-y-8">
                                    <div class="bg-white rounded-[3rem] p-10 border shadow-sm relative overflow-hidden">
                                        <div class="flex items-center justify-between mb-8"><button @click="setView('troubleList')" class="p-3 bg-slate-100 rounded-2xl"><i data-lucide="arrow-left" class="w-5 h-5"></i></button><div class="flex gap-2"><button v-if="canEditEscalation" @click="setView('troubleForm', currentItem)" class="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><i data-lucide="edit-3" class="w-4 h-4"></i></button></div></div>
                                        <div class="border-b pb-8 mb-8"><div class="flex items-center gap-3 mb-4"><span :class="TROUBLE_STATUS[currentItem.status]?.color" class="px-3 py-1 rounded-full text-[9px] font-black uppercase">{{TROUBLE_STATUS[currentItem.status]?.label}}</span><span class="text-[10px] font-black text-red-500 uppercase">Severity: {{TROUBLE_SEVERITY[currentItem.severity]?.label}}</span></div><h2 class="text-3xl font-black text-slate-900 leading-tight">{{currentItem.title}}</h2><p class="mt-4 text-xs font-bold text-slate-400 uppercase tracking-widest">Target: {{currentItem.targetEmployeeName}} ({{currentItem.targetTeam}})</p>
                                            <div class="flex flex-wrap gap-x-6 gap-y-2 mt-4 text-xs font-bold text-slate-500">
                                                <div>対応期日: <span class="text-slate-800">{{currentItem.dueDate || '未設定'}}</span></div>
                                                <div v-if="currentItem.status === 'RESOLVED'">完了期日: <span class="text-slate-800">{{currentItem.resolvedDate || '未設定'}}</span></div>
                                                <div>対応担当者: <span class="text-slate-800">{{currentItem.assigneeName || '未設定'}}</span></div>
                                            </div>
                                        </div>
                                        <div class="space-y-8">
                                            <div><h3 class="text-[10px] font-black text-slate-400 uppercase mb-4">内容・原因</h3><p class="text-lg font-medium leading-relaxed whitespace-pre-wrap text-slate-700 bg-slate-50 p-6 rounded-[2rem] border border-slate-100">{{maskText(currentItem.description)}}</p></div>
                                            <div><h3 class="text-[10px] font-black text-slate-400 uppercase mb-6">対応履歴タイムライン</h3>
                                                <div v-if="!currentItem.history || currentItem.history.length === 0" class="text-center py-10 text-slate-300 font-black text-xs uppercase">No history recorded</div>
                                                <div v-else class="space-y-6 relative pl-6 border-l-2 border-slate-100 ml-4">
                                                    <div v-for="(log, idx) in currentItem.history" :key="idx" class="relative">
                                                        <div class="absolute -left-[31px] top-1.5 w-4 h-4 bg-white border-4 border-red-500 rounded-full"></div><div class="bg-white p-5 rounded-2xl border shadow-sm"><p class="text-[10px] font-black text-slate-400 mb-2">{{log.date}} - {{log.author}}</p><p class="text-sm font-bold text-slate-700">{{maskText(log.text)}}</p></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="space-y-6">
                                    <div class="bg-red-50 p-8 rounded-[3rem] border border-red-100 sticky top-28 shadow-xl">
                                        <h3 class="text-sm font-black text-red-700 uppercase mb-6 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5"></i> 経緯を追加記録</h3>
                                        <div class="space-y-4">
                                            <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase block mb-2">ステータス更新</label><div class="flex bg-white p-1 rounded-xl shadow-sm border"><button v-for="s in TROUBLE_STATUS" :key="s.id" @click="updateTroubleStatus(s.id)" :class="currentItem.status === s.id ? s.color + ' shadow-sm' : 'text-slate-300'" class="flex-1 py-2 rounded-lg text-[9px] font-black transition-all">{{s.label}}</button></div></div>
                                            <div class="space-y-1 pt-4"><label class="text-[10px] font-black text-slate-400 uppercase block mb-2">対応ログ</label><textarea v-model="troubleLogText" rows="4" maxlength="2000" class="w-full p-4 rounded-2xl border-none outline-none font-bold text-sm shadow-inner" placeholder="進捗を記入..."></textarea></div>
                                            <button @click="addTroubleLog" :disabled="!troubleLogText" class="w-full py-4 bg-red-600 text-white rounded-2xl font-black text-xs shadow-lg hover:bg-red-700 disabled:opacity-30 transition-all flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> 保存する</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </main>

                        <div v-if="notification" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-5 rounded-[2.5rem] shadow-2xl flex items-center gap-4 z-[1000]"><div class="w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center"><i data-lucide="check" class="w-4 h-4 text-white"></i></div><span class="text-sm font-black tracking-tight">{{notification}}</span></div>
                    </div>
                </div>
            `
        };

        const vueApp = createApp(App);
        vueApp.mount('#app');
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input:focus, textarea:focus, select:focus { border: none; outline: none; }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
