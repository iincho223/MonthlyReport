services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Tokyo
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/monthlyreport
      SPRING_DATASOURCE_USERNAME: monthlyreport
      SPRING_DATASOURCE_PASSWORD: monthlyreport
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monthlyreport-net

  # スキーマは Flyway (src/main/resources/db/migration) がアプリ起動時に適用するため、
  # db サービスは空のMariaDBを用意するのみとする。
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: monthlyreport
      MARIADB_USER: monthlyreport
      MARIADB_PASSWORD: monthlyreport
      MARIADB_ROOT_PASSWORD: root
      TZ: Asia/Tokyo
    ports:
      - "3306:3306"
    volumes:
      - monthlyreport-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - monthlyreport-net

networks:
  monthlyreport-net:

volumes:
  monthlyreport-db-data:
